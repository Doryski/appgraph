name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm run assets:ensure && pnpm exec vitest run
        if: matrix.node-version != 22

      - run: pnpm run assets:ensure && pnpm exec vitest run --coverage
        if: matrix.node-version == 22

  # The default install is not covered by anything above: `typescript` is a PEER dependency, so what
  # the tests run against is this repo's devDependency, not what a consumer's package manager resolves.
  # This job packs the tarball and installs it into a clean project at BOTH ends of the supported
  # range, then runs the binary end to end, catching a peer auto-install that resolves an unsupported
  # typescript major (typescript@7 has no JS compiler API).
  packaged-install:
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: floor
            typescript: "5.0.4"
            node-version: 22
          - label: ceiling
            typescript: "6.0.3"
            node-version: 22
          - label: node20
            typescript: "6.0.3"
            node-version: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack the tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/appgraph-*.tgz)" >> "$GITHUB_ENV"

      - name: Switch to Node ${{ matrix.node-version }} for the consumer runtime (no dev tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the tarball into a clean project on typescript@${{ matrix.typescript }}
        run: |
          set -euo pipefail
          bash .github/scripts/packaged-install.sh "$TARBALL" "${{ matrix.typescript }}" "$RUNNER_TEMP/consumer-${{ matrix.label }}"

      - name: pnpm add of the tarball must fail ACTIONABLY, not with a bare module-resolution error
        run: |
          set -euo pipefail
          bash .github/scripts/pnpm-no-peer.sh "$TARBALL" "$RUNNER_TEMP/consumer-pnpm-${{ matrix.label }}"

  # Template frameworks load their compiler as an OPTIONAL peer. A project that declares the framework
  # without installing it must get one diagnostic and a screen map, not a crash.
  no-template-compiler:
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        framework: [vue, angular]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack the tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/appgraph-*.tgz)" >> "$GITHUB_ENV"

      - name: Analyze a ${{ matrix.framework }} project whose template compiler is not installed
        run: |
          set -euo pipefail
          bash .github/scripts/no-template-compiler.sh "${{ matrix.framework }}" "$TARBALL" "6.0.3" "$RUNNER_TEMP/consumer-no-compiler-${{ matrix.framework }}"

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
